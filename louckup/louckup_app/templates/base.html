<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ brand }}{% endblock %}</title>
  <link rel="icon" href="{{ root_path }}/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ root_path }}/static/favicon-32.png">
  <link rel="apple-touch-icon" href="{{ root_path }}/static/apple-touch-icon.png">
  <link rel="stylesheet" href="{{ root_path }}/static/css/louckup.css">
</head>
<body>
  {% if flash %}<div class="meldung" role="status">{{ flash }}</div>{% endif %}
  {% block body %}{% endblock %}
</body>
</html>
