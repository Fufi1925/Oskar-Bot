{% extends "base.html" %}
{% from "partials/symbole.html" import symbol %}
{% block title %}{{ brand }}{% endblock %}

{% block body %}
<div class="glow" aria-hidden="true"></div>

<div class="login-wrap">
  <div class="login-karte">
    <div class="login-bild" aria-hidden="true">{{ symbol("bot") }}</div>
    <h1>{{ brand }}</h1>
    <p>Geschlossener Bereich. Nur eingetragene Inhaber kommen weiter.</p>

    <a class="discord-knopf" href="{{ root_path }}/auth/discord">
      {{ symbol("discord") }}
      Mit Discord anmelden
    </a>
  </div>
</div>
{% endblock %}
